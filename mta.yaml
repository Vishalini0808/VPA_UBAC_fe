              sap.cloud.service: vpauseraccess
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: vpauseraccess-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: vpauseraccess-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - vpauseraccess.zip
          name: vpauseraccess
          target-path: resources/
  - name: vpauseraccess
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
